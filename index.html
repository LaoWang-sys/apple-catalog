<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Apple 美国官网商品目录</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:20px;color:#1d1d1f}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:10px 0}label{font-size:13px;display:flex;flex-direction:column}
input,select,button{padding:5px;font-size:14px}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid #ddd;padding:5px 8px;text-align:left}th{background:#f5f5f7;cursor:pointer}td.p{text-align:right;white-space:nowrap}
.meta{color:#555;font-size:13px}details{margin:12px 0;background:#fafafa;padding:8px;border-radius:6px}</style></head><body>
<h1>Apple 美国官网商品目录</h1>
<div class="meta" id="meta">加载中…</div>
<details id="chg"><summary>自上次运行以来的变化</summary><div id="chgbody"></div></details>
<div class="bar">
<label>最低价 ($)<input id="min" type="number" step="0.01"></label>
<label>最高价 ($)<input id="max" type="number" step="0.01"></label>
<label>搜索（名称/部件号）<input id="q" placeholder="例如 Watch 或 MXP63AM/A"></label>
<label>类别<select id="cat"><option value="">全部类别</option></select></label>
<label>排序<select id="sort"><option value="price-asc">价格 低→高</option><option value="price-desc">价格 高→低</option><option value="name-asc">名称 A→Z</option><option value="name-desc">名称 Z→A</option></select></label>
<button id="preset">390–399 美元</button><button id="reset">重置</button><button id="csv">导出 CSV（筛选结果）</button>
</div>
<div id="count"></div>
<table><thead><tr><th>名称</th><th>部件号</th><th>价格 (USD)</th><th>类别</th><th>最后发现</th></tr></thead><tbody id="tb"></tbody></table>
<script>
let D,rows=[];const $=id=>document.getElementById(id);
const fmtT=s=>s?new Date(s).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+'（北京时间）':'—';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
(window.__DATA__?Promise.resolve(window.__DATA__):fetch('data/products.json',{cache:'no-store'}).then(r=>r.json())).then(d=>{D=d;const m=d.meta;
$('meta').innerHTML=`最后更新：${fmtT(m.generated_at)} ｜ 商品总数：${m.total} ｜ 含部件号：${m.with_part_number}`;
[...new Set(d.items.map(i=>i.category))].sort().forEach(c=>$('cat').add(new Option(c,c)));
const c=d.changes||{};const li=(a,f)=>a&&a.length?'<ul>'+a.slice(0,200).map(f).join('')+'</ul>':'<p>无</p>';
const lk=i=>`<a href="${esc(i.url)}" target="_blank">${esc(i.name)}</a> ${esc(i.part_number)}`;
$('chgbody').innerHTML=!c.compared_to?'<p>首次运行，暂无可比较的历史数据。</p>':
`<p>对比：${esc(c.compared_to)}</p><h4>价格变动（${c.price_changed.length}）</h4>${li(c.price_changed,i=>`<li>${lk(i)}：$${i.old_price} → $${i.price}</li>`)}
<h4>新增（${c.new.length}）</h4>${li(c.new,i=>`<li>${lk(i)} $${i.price}</li>`)}<h4>下架（${c.removed.length}）</h4>${li(c.removed,i=>`<li>${lk(i)} $${i.price}</li>`)}`;
render()}).catch(e=>$('meta').textContent='加载 data/products.json 失败：'+e);
function render(){if(!D)return;const mn=parseFloat($('min').value),mx=parseFloat($('max').value),q=$('q').value.trim().toLowerCase(),ct=$('cat').value,[k,dir]=$('sort').value.split('-');
rows=D.items.filter(i=>(isNaN(mn)||i.price>=mn)&&(isNaN(mx)||i.price<=mx)&&(!ct||i.category===ct)&&(!q||(i.name+' '+i.part_number).toLowerCase().includes(q)));
rows.sort((a,b)=>(k==='price'?a.price-b.price:a.name.localeCompare(b.name))*(dir==='asc'?1:-1));
$('count').textContent=`共 ${rows.length} 件商品`;
$('tb').innerHTML=rows.map(i=>`<tr><td><a href="${esc(i.url)}" target="_blank">${esc(i.name)}</a></td><td>${esc(i.part_number)||'—'}</td><td class="p">$${i.price.toFixed(2)}</td><td>${esc(i.category)}</td><td>${fmtT(i.last_seen)}</td></tr>`).join('')}
['min','max','q','cat','sort'].forEach(id=>$(id).addEventListener('input',render));
$('preset').onclick=()=>{$('min').value=390;$('max').value=399;render()};
$('reset').onclick=()=>{['min','max','q'].forEach(i=>$(i).value='');$('cat').value='';render()};
$('csv').onclick=()=>{const h=['名称','部件号','价格','类别','链接','最后发现'];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const t='\ufeff'+[h,...rows.map(i=>[i.name,i.part_number,i.price,i.category,i.url,i.last_seen])].map(r=>r.map(q).join(',')).join('\n');
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='apple-products-filtered.csv';a.click()};
</script></body></html>
